<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 464" role="img" aria-labelledby="10-a-title 10-a-desc"><title id="10-a-title">讓 Ray 接上平台</title><desc id="10-a-desc">Ray 執行分散任務，KubeRay 管理叢集，Kubernetes 管理容器資源</desc><defs><marker id="10-a-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><rect x="0" y="0" width="720" height="464" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif" transform="translate(0 -176)"><rect x="32" y="208" width="656" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="56" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">Ray</text><text x="56" y="296" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">執行應用的分散任務</text><rect x="32" y="348" width="656" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="56" y="388" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">KubeRay</text><text x="56" y="436" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">把叢集宣告轉成受管理的資源</text><rect x="32" y="488" width="656" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="56" y="528" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">Kubernetes</text><text x="56" y="576" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">管理承載工作的容器與機器</text></g></svg>
