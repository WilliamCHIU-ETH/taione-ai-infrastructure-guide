<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 952" role="img" aria-labelledby="05-a-title 05-a-desc"><title id="05-a-title">十一個入口，四組工程問題</title><desc id="05-a-desc">四組 Track：vLLM與Ray；Kubernetes、YuniKorn與KubeRay；Kafka、Ozone、DataFusion與Comet；Airflow與Flyte。</desc><defs><marker id="05-a-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif"><rect x="0" y="0" width="720" height="952" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><circle cx="64" cy="244" r="24" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="64" y="252" font-size="24" fill="#1f70c1" font-weight="600" text-anchor="middle">1</text><rect x="112" y="208" width="576" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="136" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">模型與分散運算</text><text x="136" y="292" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">vLLM、Ray</text><circle cx="64" cy="384" r="24" fill="#fbfbfa" stroke="#6b6b68" stroke-width="2"/><text x="64" y="392" font-size="24" fill="#6b6b68" font-weight="600" text-anchor="middle">2</text><rect x="112" y="348" width="576" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="136" y="388" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">叢集與資源</text><text x="136" y="432" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">K8s、YuniKorn、KubeRay</text><circle cx="64" cy="524" r="24" fill="#fbfbfa" stroke="#6b6b68" stroke-width="2"/><text x="64" y="532" font-size="24" fill="#6b6b68" font-weight="600" text-anchor="middle">3</text><rect x="112" y="488" width="576" height="156" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="136" y="528" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">資料流動與計算</text><text x="136" y="572" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">Kafka、Ozone</text><text x="136" y="608" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">DataFusion、Comet</text><circle cx="64" cy="700" r="24" fill="#fbfbfa" stroke="#6b6b68" stroke-width="2"/><text x="64" y="708" font-size="24" fill="#6b6b68" font-weight="600" text-anchor="middle">4</text><rect x="112" y="664" width="576" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="136" y="704" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">工作流程</text><text x="136" y="748" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">Airflow、Flyte</text><text x="32" y="44" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">TAIONE / 開源基礎設施圖解</text><text x="32" y="96" font-size="32" fill="#37352f" font-weight="600" text-anchor="start">十一個入口，四組工程問題</text><text x="32" y="148" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">按需求組合，不必全部部署</text><path d="M 32 820 H 688" fill="none" stroke="#e1e1dd" stroke-width="3"/><text x="32" y="860" font-size="24" fill="#1f70c1" font-weight="500" text-anchor="start">功能分組，不是固定的部署順序</text><text x="32" y="932" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">概念示意 · 詳細條件與來源見章節正文</text></g></svg>
