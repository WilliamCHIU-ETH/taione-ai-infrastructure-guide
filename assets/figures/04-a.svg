<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 676" role="img" aria-labelledby="04-a-title 04-a-desc"><title id="04-a-title">從會使用，到能共同決定</title><desc id="04-a-desc">TAIONE 希望人才培育帶來實際貢獻、治理參與及產業連結，各步驟均需持續投入。</desc><defs><marker id="04-a-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><rect x="0" y="0" width="720" height="676" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif" transform="translate(0 -176)"><path d="M 360 328 L 360 364" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#04-a-arrow)"/><rect x="64" y="208" width="592" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="88" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">人才培育</text><text x="88" y="292" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">建立理解架構與協作的能力</text><path d="M 360 492 L 360 528" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#04-a-arrow)"/><rect x="64" y="372" width="592" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="88" y="412" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">實際貢獻</text><text x="88" y="456" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">在國際上游累積可回查成果</text><path d="M 360 656 L 360 692" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#04-a-arrow)"/><rect x="64" y="536" width="592" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="88" y="576" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">治理參與</text><text x="88" y="620" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">逐步承擔共同技術的責任</text><rect x="64" y="700" width="592" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="88" y="740" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">產業連結</text><text x="88" y="784" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">促進合作與產品服務機會</text></g></svg>
