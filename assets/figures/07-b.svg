<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 776" role="img" aria-labelledby="07-b-title 07-b-desc"><title id="07-b-title">Ray 共用哪些基礎？</title><desc id="07-b-desc">Ray AI 工具位於 Ray Core 之上，核心使用 CPU 與 GPU 機器資源</desc><defs><marker id="07-b-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif"><rect x="0" y="0" width="720" height="776" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><rect x="32" y="208" width="656" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="56" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">AI 工作工具</text><text x="56" y="296" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">資料處理、訓練、調參與服務</text><rect x="32" y="348" width="656" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="56" y="388" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">Ray Core</text><text x="56" y="436" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">分派任務、協調工作者與資料</text><rect x="32" y="488" width="656" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="56" y="528" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">機器資源</text><text x="56" y="576" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">單機或多機的 CPU 與 GPU</text><text x="32" y="44" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">TAIONE / 開源基礎設施圖解</text><text x="32" y="96" font-size="32" fill="#37352f" font-weight="600" text-anchor="start">Ray 共用哪些基礎？</text><text x="32" y="148" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">不同 AI 工作，共用分散執行核心</text><path d="M 32 644 H 688" fill="none" stroke="#e1e1dd" stroke-width="3"/><text x="32" y="684" font-size="24" fill="#1f70c1" font-weight="500" text-anchor="start">上層重用協作機制，避免各自重造</text><text x="32" y="756" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">概念示意 · 詳細條件與來源見章節正文</text></g></svg>
