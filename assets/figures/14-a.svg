<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 848" role="img" aria-labelledby="14-a-title 14-a-desc"><title id="14-a-title">同一份查詢，兩種執行路徑</title><desc id="14-a-desc">Spark 規劃查詢後，支援部分交給 Comet，其他部分保留 Spark 執行</desc><defs><marker id="14-a-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif"><rect x="0" y="0" width="720" height="848" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><rect x="144" y="208" width="432" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="168" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">Spark 查詢</text><text x="168" y="292" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">先完成查詢規劃</text><path d="M 216 328 V 432 Q 216 440 224 440 H 276" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#14-a-arrow)"/><rect x="280" y="392" width="400" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="304" y="432" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">Comet 支援</text><text x="304" y="476" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">交給加速引擎執行</text><path d="M 192 328 V 580 Q 192 588 200 588 H 276" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#14-a-arrow)"/><rect x="280" y="540" width="400" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="304" y="580" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">尚未支援</text><text x="304" y="624" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">保留 Spark 執行</text><text x="32" y="44" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">TAIONE / 開源基礎設施圖解</text><text x="32" y="96" font-size="32" fill="#37352f" font-weight="600" text-anchor="start">同一份查詢，兩種執行路徑</text><text x="32" y="148" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">保留既有 Spark 使用方式</text><path d="M 32 716 H 688" fill="none" stroke="#e1e1dd" stroke-width="3"/><text x="32" y="756" font-size="24" fill="#1f70c1" font-weight="500" text-anchor="start">加速範圍取決於查詢與版本</text><text x="32" y="828" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">概念示意 · 詳細條件與來源見章節正文</text></g></svg>
