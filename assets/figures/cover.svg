<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 916" role="img" aria-labelledby="cover-title cover-desc"><title id="cover-title">從開源運作，走到技術影響力</title><desc id="cover-desc">全書連結開源協作、企業投入、AI 基礎設施與台灣的國際參與。</desc><defs><marker id="cover-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif"><rect x="0" y="0" width="720" height="916" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><rect x="32" y="208" width="656" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="56" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">共同創造</text><text x="56" y="296" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">誰維護、誰審查、誰決定</text><rect x="32" y="348" width="656" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="56" y="388" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">企業投入</text><text x="56" y="436" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">解決自己的需求，也改善共同底層</text><rect x="32" y="488" width="656" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="56" y="528" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">AI 基礎設施</text><text x="56" y="576" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">資料、算力、工作流與模型服務</text><rect x="32" y="628" width="656" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="56" y="668" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">台灣參與</text><text x="56" y="716" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">從理解與貢獻，累積信任和責任</text><text x="32" y="44" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">TAIONE / 開源基礎設施圖解</text><text x="32" y="96" font-size="32" fill="#37352f" font-weight="600" text-anchor="start">從開源運作，走到技術影響力</text><text x="32" y="148" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">18 章，一次理解一個問題</text><path d="M 32 784 H 688" fill="none" stroke="#e1e1dd" stroke-width="3"/><text x="32" y="824" font-size="24" fill="#1f70c1" font-weight="500" text-anchor="start">看懂各個角色，才看得懂計畫意圖</text><text x="32" y="896" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">概念示意 · 詳細條件與來源見章節正文</text></g></svg>
