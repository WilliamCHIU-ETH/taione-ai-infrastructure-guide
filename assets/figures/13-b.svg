<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 664" role="img" aria-labelledby="13-b-title 13-b-desc"><title id="13-b-title">共同底座，不同產品</title><desc id="13-b-desc">DataFusion 查詢底座被 InfluxDB、Comet 與其他資料產品採用</desc><defs><marker id="13-b-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><rect x="0" y="0" width="720" height="664" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif" transform="translate(0 -176)"><rect x="144" y="208" width="432" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="168" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">DataFusion</text><text x="168" y="292" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">共用查詢規劃與執行能力</text><path d="M 216 328 V 432 Q 216 440 224 440 H 276" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#13-b-arrow)"/><rect x="280" y="392" width="400" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="304" y="432" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">InfluxDB</text><text x="304" y="476" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">時間序列資料產品</text><path d="M 192 328 V 580 Q 192 588 200 588 H 276" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#13-b-arrow)"/><rect x="280" y="540" width="400" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="304" y="580" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">Comet</text><text x="304" y="624" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">整合 Spark 的加速路徑</text><path d="M 168 328 V 728 Q 168 736 176 736 H 276" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#13-b-arrow)"/><rect x="280" y="688" width="400" height="120" rx="8" fill="white" stroke