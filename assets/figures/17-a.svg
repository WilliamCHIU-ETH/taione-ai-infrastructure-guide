<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 776" role="img" aria-labelledby="17-a-title 17-a-desc"><title id="17-a-title">選題理由，可以知道到哪裡？</title><desc id="17-a-desc">官方整體目標與各專案功能可以查證，但十一個 Track 的遴選權重、候選比較和取捨仍未知。</desc><defs><marker id="17-a-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif"><rect x="0" y="0" width="720" height="776" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><circle cx="64" cy="244" r="24" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="64" y="252" font-size="24" fill="#1f70c1" font-weight="600" text-anchor="middle">1</text><rect x="112" y="208" width="576" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="136" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">官方目標</text><text x="136" y="292" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">人才、上游貢獻、治理與產業</text><circle cx="64" cy="384" r="24" fill="#fbfbfa" stroke="#6b6b68" stroke-width="2"/><text x="64" y="392" font-size="24" fill="#6b6b68" font-weight="600" text-anchor="middle">2</text><rect x="112" y="348" width="576" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="136" y="388" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">技術線索</text><text x="136" y="432" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">功能及上下游關係可逐項查證</text><circle cx="64" cy="524" r="24" fill="#fbfbfa" stroke="#6b6b68" stroke-width="2"/><text x="64" y="532" font-size="24" fill="#6b6b68" font-weight="600" text-anchor="middle">3</text><rect x="112" y="488" width="576" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="136" y="528" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">尚未查明</text><text x="136" y="572" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">遴選權重、候選比較與取捨</text><text x="32" y="44" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">TAIONE / 開源基礎設施圖解</text><text x="32" y="96" font-size="32" fill="#37352f" font-weight="600" text-anchor="start">選題理由，可以知道到哪裡？</text><text x="32" y="148" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">整體意圖不等於逐項決策紀錄</text><path d="M 32 644 H 688" fill="none" stroke="#e1e1dd" stroke-width="3"/><text x="32" y="684" font-size="24" fill="#1f70c1" font-weight="500" text-anchor="start">可分析技術組合，不能代寫官方理由</text><text x="32" y="756" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">概念示意 · 詳細條件與來源見章節正文</text></g></svg>
