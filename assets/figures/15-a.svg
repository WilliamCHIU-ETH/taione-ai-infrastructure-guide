<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 676" role="img" aria-labelledby="15-a-title 15-a-desc"><title id="15-a-title">每天跑完，需要有順序</title><desc id="15-a-desc">每日評估依序取得資料、清理、執行評估並彙總，Airflow 管理狀態</desc><defs><marker id="15-a-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><rect x="0" y="0" width="720" height="676" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif" transform="translate(0 -176)"><path d="M 360 328 L 360 364" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#15-a-arrow)"/><rect x="64" y="208" width="592" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="88" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">取得資料</text><text x="88" y="292" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">確認昨日紀錄已經準備好</text><path d="M 360 492 L 360 528" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#15-a-arrow)"/><rect x="64" y="372" width="592" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="88" y="412" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">清理資料</text><text x="88" y="456" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">移除無效內容並檢查格式</text><path d="M 360 656 L 360 692" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#15-a-arrow)"/><rect x="64" y="536" width="592" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="88" y="576" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">執行評估</text><text x="88" y="620" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">交由工作程式呼叫模型</text><rect x="64" y="700" width="592" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="88" y="740" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">彙總報告</text><text x="88" y="784" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">前置工作完成後再發布</text></g></svg>
