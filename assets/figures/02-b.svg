<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 984" role="img" aria-labelledby="02-b-title 02-b-desc"><title id="02-b-title">提出修改之後，還要一起判斷</title><desc id="02-b-desc">修改提案經共同審查，可能返回調整，獲得接受後再依專案程序合併及發布。</desc><defs><marker id="02-b-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif"><rect x="0" y="0" width="720" height="984" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><rect x="144" y="208" width="432" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="168" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">提出修改</text><text x="168" y="292" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">交代問題、做法與測試</text><path d="M 360 332 L 360 380" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#02-b-arrow)"/><rect x="144" y="396" width="432" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="168" y="436" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">共同審查</text><text x="168" y="480" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">正確性、相容性與維護成本</text><path d="M 252 520 V 548.0 Q 252 556.0 244 556.0 H 196 Q 188 556.0 188 564.0 V 592" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#02-b-arrow)"/><path d="M 468 520 V 548.0 Q 468 556.0 476 556.0 H 524 Q 532 556.0 532 564.0 V 592" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#02-b-arrow)"/><rect x="48" y="608" width="280" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="72" y="648" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">需要調整</text><text x="72" y="692" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">補測試、改設計</text><rect x="392" y="608" width="280" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="416" y="648" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">獲得接受</text><text x="416" y="692" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">合併後依程序發布</text><path d="M 48 680 H 32 Q 24 680 24 672 V 468 Q 24 460 32 460 H 136" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#02-b-arrow)"/><text x="48" y="816" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">需要調整時，回到審查繼續討論</text><text x="32" y="44" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">TAIONE / 開源基礎設施圖解</text><text x="32" y="96" font-size="32" fill="#37352f" font-weight="600" text-anchor="start">提出修改之後，還要一起判斷</text><text x="32" y="148" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">提交、接受、發布是不同階段</text><path d="M 32 852 H 688" fill="none" stroke="#e1e1dd" stroke-width="3"/><text x="32" y="892" font-size="24" fill="#1f70c1" font-weight="500" text-anchor="start">別人要能看懂，也能持續承擔改動</text><text x="32" y="964" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">概念示意 · 詳細條件與來源見章節正文</text></g></svg>
