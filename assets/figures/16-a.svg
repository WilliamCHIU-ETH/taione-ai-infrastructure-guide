<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="16-a-title 16-a-desc"><title id="16-a-title">實驗中斷，成果如何保留？</title><desc id="16-a-desc">Flyte 工作成功後比較結果；失敗時才依政策重試或恢復，結果重用取決於設定</desc><defs><marker id="16-a-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif"><rect x="0" y="0" width="720" height="1000" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><rect x="120" y="208" width="480" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="144" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">準備資料</text><text x="144" y="292" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">留下可追蹤的成果</text><path d="M 360 332 L 360 372" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#16-a-arrow)"/><rect x="120" y="380" width="480" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="144" y="420" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">執行模型</text><text x="144" y="464" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">各任務有資源與錯誤設定</text><path d="M 224 504 V 550.0 Q 224 558.0 216 558.0 H 188 Q 180 558.0 180 566.0 V 612" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#16-a-arrow)"/><path d="M 496 504 V 550.0 Q 496 558.0 504 558.0 H 528 Q 536 558.0 536 566.0 V 612" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#16-a-arrow)"/><text x="116" y="584" font-size="26" fill="#1f70c1" font-weight="400" text-anchor="start">成功</text><text x="552" y="584" font-size="26" fill="#6b6b68" font-weight="400" text-anchor="start">失敗</text><rect x="32" y="620" width="296" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="56" y="660" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">比較結果</text><text x="56" y="704" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">核對版本再重用</text><rect x="392" y="620" width="296" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="416" y="660" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">需要時處理失敗</text><text x="416" y="704" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">依政策重試或恢復</text><path d="M 688 680 H 704 V 440 H 608" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#16-a-arrow)"/><text x="32" y="816" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">失敗路徑依設定處理，不保證自動恢復</text><text x="32" y="44" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">TAIONE / 開源基礎設施圖解</text><text x="32" y="96" font-size="32" fill="#37352f" font-weight="600" text-anchor="start">實驗中斷，成果如何保留？</text><text x="32" y="148" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">Flyte 記錄與協調工作狀態</text><path d="M 32 868 H 688" fill="none" stroke="#e1e1dd" stroke-width="3"/><text x="32" y="908" font-size="24" fill="#1f70c1" font-weight="500" text-anchor="start">快取與恢復需由作者正確設定</text><text x="32" y="980" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">概念示意 · 詳細條件與來源見章節正文</text></g></svg>
