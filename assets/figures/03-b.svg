<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 824" role="img" aria-labelledby="03-b-title 03-b-desc"><title id="03-b-title">程式可取得，營運仍需要人</title><desc id="03-b-desc">自行營運者取得開源程式並承擔部署維護，購買服務者則付費取得託管、整合與支援。</desc><defs><marker id="03-b-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif"><rect x="0" y="0" width="720" height="824" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><rect x="32" y="208" width="656" height="208" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><circle cx="84" cy="272" r="24" fill="#fbfbfa" stroke="#6b6b68" stroke-width="2"/><circle cx="84" cy="256" r="8" fill="white" stroke="#6b6b68" stroke-width="2"/><path d="M 64 308 V 296 Q 64 288 72 288 H 96 Q 104 288 104 296 V 308" fill="none" stroke="#6b6b68" stroke-width="3"/><rect x="168" y="236" width="128" height="104" rx="8" fill="white" stroke="#1f70c1" stroke-width="2"/><rect x="184" y="252" width="96" height="16" rx="4" fill="#fbfbfa" stroke="#e1e1dd" stroke-width="2"/><circle cx="268" cy="260" r="3" fill="#1f70c1" stroke="#1f70c1" stroke-width="2"/><rect x="184" y="276" width="96" height="16" rx="4" fill="#fbfbfa" stroke="#e1e1dd" stroke-width="2"/><circle cx="268" cy="284" r="3" fill="#1f70c1" stroke="#1f70c1" stroke-width="2"/><rect x="184" y="300" width="96" height="16" rx="4" fill="#fbfbfa" stroke="#e1e1dd" stroke-width="2"/><circle cx="268" cy="308" r="3" fill="#1f70c1" stroke="#1f70c1" stroke-width="2"/><text x="232.0" y="376" font-size="24" fill="#37352f" font-weight="500" text-anchor="middle">自己維護</text><text x="336" y="260" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">自行營運</text><text x="336" y="308" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">部署、更新、值班</text><text x="336" y="344" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">由自己的團隊負責</text><rect x="32" y="444" width="656" height="208" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><circle cx="96" cy="500" r="28" fill="white" stroke="#1f70c1" stroke-width="2"/><circle cx="132" cy="496" r="40" fill="white" stroke="#1f70c1" stroke-width="2"/><circle cx="172" cy="504" r="28" fill="white" stroke="#1f70c1" stroke-width="2"/><rect x="84" y="504" width="100" height="36" rx="0" fill="white" stroke="white" stroke-width="2"/><text x="132" y="604" font-size="24" fill="#37352f" font-weight="500" text-anchor="middle">服務商營運</text><text x="336" y="496" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">購買託管服務</text><text x="336" y="544" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">付費取得營運能力</text><text x="336" y="580" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">責任依合約分工</text><text x="32" y="44" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">TAIONE / 開源基礎設施圖解</text><text x="32" y="96" font-size="32" fill="#37352f" font-weight="600" text-anchor="start">程式可取得，營運仍需要人</text><text x="32" y="148" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">同一開源生態中的兩種選擇</text><path d="M 32 692 H 688" fill="none" stroke="#e1e1dd" stroke-width="3"/><text x="32" y="732" font-size="24" fill="#1f70c1" font-weight="500" text-anchor="start">企業可以在共同基礎上提供付費價值</text><text x="32" y="804" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">概念示意 · 詳細條件與來源見章節正文</text></g></svg>
