<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 916" role="img" aria-labelledby="01-a-title 01-a-desc"><title id="01-a-title">看見答案背後的共同工作</title><desc id="01-a-desc">AI 服務體驗需要模型執行、資料與流程、運行資源共同支撐；各系統按需求選擇。</desc><defs><marker id="01-a-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif"><rect x="0" y="0" width="720" height="916" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><rect x="32" y="208" width="656" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="56" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">服務體驗</text><text x="56" y="296" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">顧客期待正確、及時的回答</text><rect x="32" y="348" width="656" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="56" y="388" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">模型執行</text><text x="56" y="436" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">讓請求能使用模型與算力</text><rect x="32" y="488" width="656" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="56" y="528" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">資料與流程</text><text x="56" y="576" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">更新資料，協調前後步驟</text><rect x="32" y="628" width="656" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="56" y="668" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">運行資源</text><text x="56" y="716" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">安排機器，處理擴展與故障</text><text x="32" y="44" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">TAIONE / 開源基礎設施圖解</text><text x="32" y="96" font-size="32" fill="#37352f" font-weight="600" text-anchor="start">看見答案背後的共同工作</text><text x="32" y="148" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">以商店 AI 客服為概念情境</text><path d="M 32 784 H 688" fill="none" stroke="#e1e1dd" stroke-width="3"/><text x="32" y="824" font-size="24" fill="#1f70c1" font-weight="500" text-anchor="start">這是責任分工，不是固定的請求路線</text><text x="32" y="896" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">概念示意 · 詳細條件與來源見章節正文</text></g></svg>
