<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 676" role="img" aria-labelledby="18-a-title 18-a-desc"><title id="18-a-title">信任，從持續承擔責任累積</title><desc id="18-a-desc">理解問題、完成貢獻、持續照顧共同品質可累積信任；是否取得更多權限由各社群決定。</desc><defs><marker id="18-a-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><rect x="0" y="0" width="720" height="676" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif" transform="translate(0 -176)"><path d="M 64 256 V 384" fill="none" stroke="#e1e1dd" stroke-width="3"/><circle cx="64" cy="236" r="24" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="64" y="244" font-size="24" fill="#1f70c1" font-weight="600" text-anchor="middle">1</text><rect x="112" y="208" width="576" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="136" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">理解問題</text><text x="136" y="292" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">提出可重現、可討論的案例</text><path d="M 64 420 V 548" fill="none" stroke="#e1e1dd" stroke-width="3"/><circle cx="64" cy="400" r="24" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="64" y="408" font-size="24" fill="#1f70c1" font-weight="600" text-anchor="middle">2</text><rect x="112" y="372" width="576" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="136" y="412" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">完成貢獻</text><text x="136" y="456" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">修正、測試、文件與回應審查</text><path d="M 64 584 V 712" fill="none" stroke="#e1e1dd" stroke-width="3"/><circle cx="64" cy="564" r="24" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="64" y="572" font-size="24" fill="#1f70c1" font-weight="600" text-anchor="middle">3</text><rect x="112" y="536" width="576" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="136" y="576" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">照顧共同品質</text><text x="136" y="620" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">協助他人，持續追蹤影響</text><circle cx="64" cy="728" r="24" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="64" y="736" font-size="24" fill="#1f70c1" font-weight="600" text-anchor="middle">4</text><rect x="112" y="700" width="576" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="136" y="740" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">承擔更多責任</text><text x="136" y="784" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">經社群認可參與審查與設計</text></g></svg>
