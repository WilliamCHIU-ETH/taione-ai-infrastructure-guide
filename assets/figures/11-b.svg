<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 824" role="img" aria-labelledby="11-b-title 11-b-desc"><title id="11-b-title">讀取進度可以不同</title><desc id="11-b-desc">事件紀錄由設定保留，消費者甲和乙有不同進度，乙可恢復後接續讀取</desc><defs><marker id="11-b-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif"><rect x="0" y="0" width="720" height="824" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><text x="32" y="232" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">事件持續寫入可保留的紀錄</text><rect x="48" y="268" width="88" height="64" rx="4" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="92" y="312" font-size="28" fill="#1f70c1" font-weight="600" text-anchor="middle">1</text><rect x="152" y="268" width="88" height="64" rx="4" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="196" y="312" font-size="28" fill="#1f70c1" font-weight="600" text-anchor="middle">2</text><rect x="256" y="268" width="88" height="64" rx="4" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="300" y="312" font-size="28" fill="#1f70c1" font-weight="600" text-anchor="middle">3</text><rect x="360" y="268" width="88" height="64" rx="4" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="404" y="312" font-size="28" fill="#1f70c1" font-weight="600" text-anchor="middle">4</text><rect x="464" y="268" width="88" height="64" rx="4" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="508" y="312" font-size="28" fill="#1f70c1" font-weight="600" text-anchor="middle">5</text><rect x="568" y="268" width="88" height="64" rx="4" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="612" y="312" font-size="28" fill="#1f70c1" font-weight="600" text-anchor="middle">6</text><path d="M 48 356 H 676" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#11-b-arrow)"/><text x="32" y="404" font-size="26" fill="#37352f" font-weight="600" text-anchor="start">不同讀者可以走到不同位置</text><text x="32" y="456" font-size="24" fill="#37352f" font-weight="500" text-anchor="start">即時分析</text><path d="M 192 448 H 664" fill="none" stroke="#e1e1dd" stroke-width="3"/><circle cx="608" cy="448" r="12" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="672" y="456" font-size="24" fill="#1f70c1" font-weight="400" text-anchor="end">6</text><text x="32" y="528" font-size="24" fill="#37352f" font-weight="500" text-anchor="start">資料儲存</text><path d="M 192 520 H 664" fill="none" stroke="#e1e1dd" stroke-width="3"/><circle cx="448" cy="520" r="12" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="672" y="528" font-size="24" fill="#1f70c1" font-weight="400" text-anchor="end">4</text><text x="32" y="600" font-size="24" fill="#37352f" font-weight="500" text-anchor="start">特徵處理</text><path d="M 192 592 H 664" fill="none" stroke="#e1e1dd" stroke-width="3"/><circle cx="288" cy="592" r="12" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="672" y="600" font-size="24" fill="#1f70c1" font-weight="400" text-anchor="end">2</text><text x="32" y="44" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">TAIONE / 開源基礎設施圖解</text><text x="32" y="96" font-size="32" fill="#37352f" font-weight="600" text-anchor="start">讀取進度可以不同</text><text x="32" y="148" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">事件仍保留時，可以繼續重讀</text><path d="M 32 692 H 688" fill="none" stroke="#e1e1dd" stroke-width="3"/><text x="32" y="732" font-size="24" fill="#1f70c1" font-weight="500" text-anchor="start">讀過不等於立刻刪除</text><text x="32" y="804" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">概念示意 · 詳細條件與來源見章節正文</text></g></svg>
