<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 988" role="img" aria-labelledby="03-a-title 03-a-desc"><title id="03-a-title">修共同底層，也在改善自己的服務</title><desc id="03-a-desc">公司因報表問題投入修正，經上游社群審查後，共同底層改善，自己和其他使用者都受益。</desc><defs><marker id="03-a-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif"><rect x="0" y="0" width="720" height="988" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><path d="M 360 328 L 360 364" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#03-a-arrow)"/><rect x="64" y="208" width="592" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="88" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">營運遇到問題</text><text x="88" y="292" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">報表漏資料，公司承擔損失</text><path d="M 360 492 L 360 528" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#03-a-arrow)"/><rect x="64" y="372" width="592" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="88" y="412" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">投入工程時間</text><text x="88" y="456" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">重現錯誤、修正並補測試</text><path d="M 360 656 L 360 692" fill="none" stroke="#6b6b68" stroke-width="3" marker-end="url(#03-a-arrow)"/><rect x="64" y="536" width="592" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="88" y="576" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">社群共同審查</text><text x="88" y="620" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">確認能解決問題且不破壞他人</text><rect x="64" y="700" width="592" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="88" y="740" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">共同底層改善</text><text x="88" y="784" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">自己與其他使用者都可受益</text><text x="32" y="44" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">TAIONE / 開源基礎設施圖解</text><text x="32" y="96" font-size="32" fill="#37352f" font-weight="600" text-anchor="start">修共同底層，也在改善自己的服務</text><text x="32" y="148" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">電商報表出錯的假想情境</text><path d="M 32 856 H 688" fill="none" stroke="#e1e1dd" stroke-width="3"/><text x="32" y="896" font-size="24" fill="#1f70c1" font-weight="500" text-anchor="start">別人也受益，不會消除自己的回報</text><text x="32" y="968" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">概念示意 · 詳細條件與來源見章節正文</text></g></svg>
