<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 604" role="img" aria-labelledby="12-a-title 12-a-desc"><title id="12-a-title">資料倉庫可以自己部署</title><desc id="12-a-desc">應用經 S3 相容或 Hadoop 介面連到 Ozone，資料存於多台節點</desc><defs><marker id="12-a-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><rect x="0" y="0" width="720" height="604" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif" transform="translate(0 -176)"><rect x="32" y="208" width="656" height="120" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="56" y="248" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">應用與分析</text><text x="56" y="296" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">圖片、報告與模型資料</text><rect x="32" y="348" width="656" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="56" y="388" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">存取介面</text><text x="56" y="436" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">S3 相容或 Hadoop 介面</text><rect x="32" y="488" width="656" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="56" y="528" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">Ozone 管理</text><text x="56" y="576" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">管理名稱、位置和存取</text><rect x="32" y="628" width="656" height="120" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><text x="56" y="668" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">儲存節點</text><text x="56" y="716" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">多台機器承載資料內容</text></g></svg>
