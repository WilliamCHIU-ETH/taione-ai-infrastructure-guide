<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 764" role="img" aria-labelledby="09-b-title 09-b-desc"><title id="09-b-title">半套資源也可能造成等待</title><desc id="09-b-desc">逐個啟動可能讓作業各自等待；成組排程先確認所需資源組合</desc><defs><marker id="09-b-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b6b68"/></marker></defs><g font-family="&#x27;Noto Sans TC&#x27;,&#x27;PingFang TC&#x27;,&#x27;Heiti TC&#x27;,sans-serif"><rect x="0" y="0" width="720" height="764" rx="0" fill="#fbfbfa" stroke="none" stroke-width="2"/><rect x="32" y="208" width="656" height="168" rx="8" fill="white" stroke="#e1e1dd" stroke-width="2"/><circle cx="76" cy="252" r="20" fill="#fbfbfa" stroke="#6b6b68" stroke-width="2"/><text x="76" y="260" font-size="24" fill="#6b6b68" font-weight="600" text-anchor="middle">1</text><text x="116" y="256" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">逐個啟動</text><text x="56" y="316" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">多個作業可能各占一部分後等待</text><rect x="32" y="396" width="656" height="168" rx="8" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><circle cx="76" cy="440" r="20" fill="#edf4fa" stroke="#1f70c1" stroke-width="2"/><text x="76" y="448" font-size="24" fill="#1f70c1" font-weight="600" text-anchor="middle">2</text><text x="116" y="444" font-size="28" fill="#37352f" font-weight="600" text-anchor="start">成組規劃</text><text x="56" y="504" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">確認所需資源組合，再啟動工作</text><text x="32" y="44" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">TAIONE / 開源基礎設施圖解</text><text x="32" y="96" font-size="32" fill="#37352f" font-weight="600" text-anchor="start">半套資源也可能造成等待</text><text x="32" y="148" font-size="24" fill="#6b6b68" font-weight="400" text-anchor="start">需要一組工作者的情境</text><path d="M 32 632 H 688" fill="none" stroke="#e1e1dd" stroke-width="3"/><text x="32" y="672" font-size="24" fill="#1f70c1" font-weight="500" text-anchor="start">Gang scheduling 考慮整組工作需求</text><text x="32" y="744" font-size="20" fill="#6b6b68" font-weight="400" text-anchor="start">概念示意 · 詳細條件與來源見章節正文</text></g></svg>
